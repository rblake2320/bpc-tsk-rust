[workspace]
resolver = "3"
members = ["crates/bpc-tsk-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/rblake2320/bpc-tsk-rust"
publish = false

[workspace.dependencies]
hmac = "0.12.1"
sha2 = "0.10.9"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4"] }
axum = { version = "0.8.8", default-features = false }
postgres = { version = "0.19.14", features = ["with-uuid-1"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "0.13.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
module_name_repetitions = "allow"
